name: Validar Marmota

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar código
        run: npm run lint
      - name: Compilar
        run: npm run build
